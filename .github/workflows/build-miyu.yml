name: Build Miyu APK

on:
  workflow_dispatch :
  push:
    branches: [ main, master ]

job s:
  build:
    runs-on: ubuntu-latest
    ti meout-minutes: 300

    steps:
      - name:  Checkout patched files
        uses: actions/ checkout@v4
        with:
          fetch-dep th: 1

      - name: Set up JDK 17
        us es: actions/setup-java@v4
        with:
           distribution: temurin
          java-ver sion: '17'

      - name: Set up Android SDK
         uses: android-actions/setup-android@v 3

      - name: Install SDK packages
         shell: bash
        run: |
          yes | s dkmanager --licenses > /dev/null || true
           sdkmanager "platform-tools" "platforms; android-36" "build-tools;36.0.0" "ndk;27.2.12 479018" "cmake;3.22.1"

      - name: Clone u pstream
        shell: bash
        run: |
           commit="$(git ls-remote https://githu b.com/DrKLO/Telegram.git refs/heads/master |  cut -f1)"
          echo "upstream master=$co mmit"
          git clone --recursive https:/ /github.com/DrKLO/Telegram.git upstream
           echo "UPSTREAM_COMMIT=$commit" >> "$GITH UB_ENV"

      - name: Apply Miyu branding pa tch
        shell: bash
        run: |
           cd upstream
          git apply --verbose  "../miyu_patch.diff" || git apply --reject " ../miyu_patch.diff"
          # report result  files exist
          test -f TMessagesProj/ src/main/res/values/strings.xml && echo "stri ngs OK"

      - name: Trim to arm64-v8a only  (faster build)
        shell: bash
        r un: |
          cd upstream
          sed -i  's|"armeabi-v7a", "arm64-v8a", "x86", "x86_64 "|"arm64-v8a"|g' TMessagesProj_App/build.grad le
          sed -i 's|"armeabi-v7a", "arm64- v8a", "x86", "x86_64"|"arm64-v8a"|g' TMessage sProj/config/*.gradle 2>/dev/null || true
           grep -rn "abiFilters" TMessagesProj_Ap p/build.gradle | head

      - name: Ensure s ubmodules are initialized
        shell: bash 
        run: |
          cd upstream
           git submodule update --init --recursive -- force 2>&1 | tail -5 || true
          for p  in third_party/xiph/opusfile/src/info.c lib/j latexmath/jlatexmath/build.gradle; do
             if [ -f "TMessagesProj/$p" ]; then echo  "OK  $p"; else echo "MISSING $p"; fi
           done

      - name: Cache Gradle
        us es: actions/cache@v4
        with:
           path: |
            ~/.gradle/caches
             ~/.gradle/wrapper
          key: gradle-$ {{ runner.os }}-${{ hashFiles('**/*.gradle*',  '**/gradle-wrapper.properties') }}
           restore-keys: |
            gradle-${{ runne r.os }}-

      - name: Build APK (debug)
         shell: bash
        env:
          ANDRO ID_HOME: /usr/local/lib/android/sdk
        w orking-directory: upstream
        run: |
           export ANDROID_HOME="$ANDROID_HOME"
           echo "sdk.dir=$ANDROID_HOME" > local. properties
          echo "org.gradle.jvmargs =-Xmx4g -XX:MaxMetaspaceSize=512m" >> gradle. properties
          ./gradlew --no-daemon :T MessagesProj_App:assembleAfatDebug

      - n ame: Upload APK artifact
        uses: action s/upload-artifact@v4
        with:
           name: miyu-apk
          path: |
             upstream/TMessagesProj_App/build/outputs/apk/ **/*.apk
          if-no-files-found: error

       - name: Debug list outputs
        if:  always()
        shell: bash
        run: |
           find . -name "*.apk" 2>/dev/null ||  true 