name: Build Miyu APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout patched files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Clone upstream
        shell: bash
        run: |
          commit="$(git ls-remote https://github.com/DrKLO/Telegram.git refs/heads/master | cut -f1)"
          echo "upstream master=$commit"
          git clone --recursive https://github.com/DrKLO/Telegram.git upstream
          echo "UPSTREAM_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Apply Miyu branding patch
        shell: bash
        run: |
          cd upstream
          git apply --verbose "../miyu_patch.diff" || git apply --reject "../miyu_patch.diff"
          test -f TMessagesProj/src/main/res/values/strings.xml && echo "strings OK"

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          cd upstream
          git submodule update --init --recursive --force 2>&1 | tail -5 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK (debug)
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        working-directory: upstream
        run: |
          export ANDROID_HOME="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyu-apk
          path: |
            upstream/TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Debug list outputs
        if: always()
        shell: bash
        run: |
          find . -name "*.apk" 2>/dev/null || true
